name: AppImage Release

# Cada push a main: tests -> AppImage -> Release nuevo.
#
# Ojo con la estrategia de tags: como la versión de la app no cambia en
# cada push, el tag lleva el nº de ejecución (v1.0.0-build7, v1.0.0-build8…)
# y el ejecutable se llama kage-gui-<versión>.AppImage (kage-gui-1.0.0.AppImage).
# y el release se marca como "pre-release". Si prefieres releases solo
# cuando tú lo decidas, cambia el disparador a tags:
#   on:
#     push:
#       tags: ['v*']
# y usa ese tag (github.ref_name) en el paso de publicación.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appimage-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Versión de kage que se empaqueta DENTRO del AppImage.
  KAGE_VERSION: "0.3.12"
  # Los runners no tienen FUSE: todo AppImage (appimagetool incluido)
  # se ejecuta extraído en vez de montado.
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Leer versión de la app
        id: version
        run: |
          VERSION="$(python3 -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('kage_gui/__init__.py').read()).group(1))")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION-build${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Tests de lógica (sin GTK)
        run: python3 -m unittest discover -s tests -v

      - name: Descargar kage oficial (se empaqueta en el AppImage)
        run: |
          mkdir -p build
          base="https://github.com/tamnd/kage/releases/download/v${KAGE_VERSION}"
          file="kage_${KAGE_VERSION}_linux_amd64.tar.gz"
          # 1) Descargar el binario oficial de kage y su lista de hashes.
          curl -fL -o "build/$file" "$base/$file"
          curl -fL -o "build/checksums.txt" "$base/checksums.txt"
          # 2) Verificar la integridad comparando los dos hashes directamente.
          #    (No se usa `sha256sum -c checksums.txt`: ese modo busca el
          #    archivo por el nombre que trae la lista, y si el descargado se
          #    llama distinto falla con "No such file or directory".)
          expected="$(awk -v f="$file" '$2 == f {print $1}' build/checksums.txt)"
          actual="$(sha256sum "build/$file" | cut -d' ' -f1)"
          echo "sha256 esperado (checksums.txt): $expected"
          echo "sha256 del archivo descargado:   $actual"
          test -n "$expected" && test "$expected" = "$actual"
          # 3) Extraer y dejar el binario listo en build/kage, que es lo que
          #    la receta AppImageBuilder.yml copia dentro del AppImage.
          tar xzf "build/$file" -C build
          chmod +x build/kage
          ./build/kage --version

      - name: Instalar appimage-builder y appimagetool
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-setuptools patchelf desktop-file-utils wget file libfuse2 xvfb
          sudo wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool
          python3 -m pip install "appimage-builder==1.1.0"

      - name: Construir el AppImage
        run: appimage-builder --recipe AppImageBuilder.yml

      - name: Smoke test (la ventana debe abrir y quedarse viva)
        run: |
          appimage="$(ls kage-gui-*.AppImage)"
          chmod +x "$appimage"
          set +e
          timeout 15 xvfb-run -a "./$appimage" > smoke.log 2>&1
          code=$?
          set -e
          cat smoke.log
          # 124 = timeout la mató: la app seguía abierta, que es lo esperado.
          # Cualquier otro código = se cerró sola o explotó al arrancar.
          if [ "$code" -ne 124 ]; then
            echo "::error::La AppImage no arrancó (código $code)"
            exit 1
          fi
          echo "OK: la ventana abrió y seguía viva a los 15 s"

      - name: Publicar Release con el AppImage
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Kage GUI ${{ steps.version.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: |
            kage-gui-*.AppImage
