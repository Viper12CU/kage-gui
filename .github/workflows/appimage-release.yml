name: AppImage Release

# Cada push a main: tests -> AppImage -> Release nuevo.
#
# Ojo con la estrategia de tags: como la versión de la app no cambia en
# cada push, el tag lleva el nº de ejecución (v1.0.0-build7, v1.0.0-build8…)
# y el ejecutable se llama kage-gui-<versión>.AppImage (kage-gui-1.0.0.AppImage).
# y el release se marca como "pre-release". Si prefieres releases solo
# cuando tú lo decidas, cambia el disparador a tags:
#   on:
#     push:
#       tags: ['v*']
# y usa ese tag (github.ref_name) en el paso de publicación.
#
# ARQUITECTURA (v6): este workflow es deliberadamente FINO y estable.
# Toda la lógica de construcción vive en packaging/build-appimage.sh,
# un archivo normal del repo que se puede corregir con PRs sin tocar
# este workflow. Se acabó appimage-builder (sin mantenimiento desde
# 2022): el script arma el AppDir a mano, extrae los .deb del propio
# apt del runner con dpkg -x y empaqueta con appimagetool oficial.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appimage-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Los runners no tienen FUSE: todo AppImage (appimagetool incluido)
  # se ejecuta extraído en vez de montado.
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Leer versión de la app
        id: version
        run: |
          VERSION="$(python3 -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('kage_gui/__init__.py').read()).group(1))")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION-build${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Tests de lógica (sin GTK)
        run: python3 -m unittest discover -s tests -v

      # NOTA: el AppImage SÍ lleva kage dentro (decisión de Fabian del
      # 2026-10-31, que revierte la de la v4): build-appimage.sh descarga
      # la release oficial de kage, verifica su sha256 y la empaqueta, así
      # que el ejecutable es autocontenido. La GUI también sigue pudiendo
      # usar un kage del sistema cuando corre desde el código fuente.

      - name: Instalar appimagetool y utilidades
        run: |
          sudo apt-get update
          sudo apt-get install -y wget file libfuse2 xvfb
          sudo wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Construir el AppImage
        run: |
          echo "== MARCADOR workflow v6: build manual con build-appimage.sh, SIN appimage-builder =="
          bash packaging/build-appimage.sh

      - name: Smoke test (la ventana debe abrir y quedarse viva)
        run: |
          appimage="$(ls kage-gui-*.AppImage)"
          chmod +x "$appimage"
          set +e
          timeout 15 xvfb-run -a "./$appimage" > smoke.log 2>&1
          code=$?
          set -e
          cat smoke.log
          # 124 = timeout la mató: la app seguía abierta, que es lo esperado.
          # Cualquier otro código = se cerró sola o explotó al arrancar.
          if [ "$code" -ne 124 ]; then
            echo "::error::La AppImage no arrancó (código $code)"
            exit 1
          fi
          echo "OK: la ventana abrió y seguía viva a los 15 s"

      - name: Publicar Release con el AppImage
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Kage GUI ${{ steps.version.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: |
            kage-gui-*.AppImage
